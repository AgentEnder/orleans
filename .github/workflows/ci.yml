name: .NET CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
permissions:
  contents: read
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '24.x'
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
      with:
        global-json-file: global.json
    - name: Test coverage reporting
      if: matrix.os == 'ubuntu-latest'
      shell: pwsh
      run: ./.github/scripts/test-summarize-coverage.ps1
    - name: Build
      run: dotnet build -bl
    - name: Pack and validate package compatibility
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack Orleans.slnx --configuration Debug --no-build --no-restore -bl:package_validation.binlog
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      continue-on-error: true
      with:
        name: build_log_${{ matrix.os }}
        retention-days: 1
        path: |
          **/*.binlog
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        suite: [BVT]
        os: [ubuntu-latest]
        framework: ["net10.0"]
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
    - name: Setup Node.js
      if: matrix.suite == 'BVT'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '24.x'
    - name: Test
      uses: ./.github/actions/run-tests
      with:
        artifact-name: test_output_${{ github.job }}_${{ matrix.suite }}_${{ matrix.os }}_${{ matrix.framework }}
        build-external-assets: ${{ matrix.suite == 'BVT' && 'true' || 'false' }}
        filter-query: /[(Provider=None)&(Suite=${{ matrix.suite }})&(Area!=CodeGen)]
        framework: ${{ matrix.framework }}
  test-codegenerator:
    name: Test Code Generator
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        framework: ["net10.0"]
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
    - name: Test Code Generator
      uses: ./.github/actions/run-tests
      with:
        artifact-name: test_output_${{ github.job }}_${{ matrix.os }}_${{ matrix.framework }}
        filter-query: /[(Provider=None)&(Area=CodeGen)&((Suite=BVT)|(Suite=SlowBVT)|(Suite=Functional))]
        framework: ${{ matrix.framework }}
  ci:
    name: CI
    if: always()
    needs:
      - build
      - test
      - test-codegenerator
    runs-on: ubuntu-latest
    steps:
    - name: Verify all CI jobs succeeded
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
