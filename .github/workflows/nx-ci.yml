name: Nx CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  NX_BATCH_MODE: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: ./nx start-ci-run --distribute-on=".nx/workflows/distribution-config.yaml" --stop-agents-after="test:bvt,test:slowbvt,test:functional,test:redis,test:postgres,test:sqlite,test:azurestorage,test:azurestorage-bvt,test:azurestorage-slowbvt,test:azurestorage-functional,test:azurestorage-functional-1,test:azurestorage-functional-2,test:functional-1,test:functional-2,test:nats"

      # Installs the .NET SDK pinned in mise.toml
      - uses: jdx/mise-action@v2

      - uses: nrwl/nx-set-shas@v4

      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected.
      # Provider suites run as configurations of the inferred test target, scoped by project tag.
      # The test commands run in parallel against the same pipeline execution so the agents stay busy.
      # Build first so every test command below finds its dependencies in the cache
      - run: ./nx affected -t build

      - run: |
          # Provider=None suites, one run per suite so no single task carries a whole project's tests
          ./nx affected -t test -c bvt &
          ./nx affected -t test -c slowbvt &
          ./nx affected -t test -c functional &
          # Class-level shards of the longest Provider=None suite
          ./nx run Orleans.Runtime.Internal.Tests:test:functional-1 &
          ./nx run Orleans.Runtime.Internal.Tests:test:functional-2 &
          ./nx run-many -t test -c redis -p tag:provider:redis &
          ./nx run-many -t test -c postgres -p tag:provider:postgres &
          ./nx run-many -t test -c sqlite -p tag:provider:sqlite &
          # One run per Azure Storage project: tasks with a continuous dependency are pinned to one agent per run
          ./nx run Orleans.Azure.Tests:test:azurestorage-bvt &
          ./nx run Orleans.Azure.Tests:test:azurestorage-slowbvt &
          ./nx run Orleans.Azure.Tests:test:azurestorage-functional &
          ./nx run Orleans.Azure.Tests:test:azurestorage-functional-1 &
          ./nx run Orleans.Azure.Tests:test:azurestorage-functional-2 &
          ./nx run Orleans.Transactions.Azure.Test:test:azurestorage-bvt &
          ./nx run Orleans.Transactions.Azure.Test:test:azurestorage-slowbvt &
          ./nx run Orleans.Transactions.Azure.Test:test:azurestorage-functional &
          ./nx run Orleans.Transactions.Azure.Test:test:azurestorage-functional-1 &
          ./nx run Orleans.Transactions.Azure.Test:test:azurestorage-functional-2 &
          ./nx run Orleans.DurableJobs.AzureStorage.Tests:test:azurestorage &
          ./nx run Orleans.Journaling.Tests:test:azurestorage &
          ./nx run Orleans.Runtime.Internal.Tests:test:azurestorage &
          ./nx run-many -t test -c nats -p tag:provider:nats &
          status=0
          for job in $(jobs -p); do wait "$job" || status=1; done
          exit $status

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: ./nx fix-ci
        if: always()
