name: Nx CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  NX_BATCH_MODE: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: ./nx start-ci-run --distribute-on=".nx/workflows/distribution-config.yaml" --stop-agents-after="test:bvt,test:slowbvt,test:functional,test:redis,test:postgres,test:sqlite,test:azurestorage,test:azurestorage-bvt,test:azurestorage-functional,test:azurestorage-functional-1,test:azurestorage-functional-2,test:functional-1,test:functional-2,test:nats"

      # Installs the .NET SDK pinned in mise.toml
      - uses: jdx/mise-action@v2

      - uses: nrwl/nx-set-shas@v4

      # Diagnostic: fingerprint the inferred configuration of a test project on the main job
      - run: |
          ./nx show project Orleans.Core.Tests --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=require("crypto").createHash("sha256").update(s).digest("hex");console.log("CONFIG-FINGERPRINT main Orleans.Core.Tests "+c);console.log(s)})'

      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected.
      # Provider suites run as configurations of the inferred test target, scoped by project tag; each
      # task starts its own emulator through ci/services/with-service.sh. The commands run in parallel
      # against the same pipeline execution so the agents stay busy.
      # Build first so every test command below finds its dependencies in the cache
      - run: ./nx affected -t build

      - run: |
          # Provider=None suites, one run per suite so no single task carries a whole project's tests
          ./nx affected -t test -c bvt &
          ./nx affected -t test -c slowbvt &
          ./nx affected -t test -c functional &
          ./nx run-many -t test -c redis -p tag:provider:redis &
          ./nx run-many -t test -c postgres -p tag:provider:postgres &
          ./nx run-many -t test -c sqlite -p tag:provider:sqlite &
          # Azure Storage: one command per configuration; the shard configurations only match tests on the two heavy projects
          ./nx run-many -t test -c azurestorage -p tag:provider:azurestorage &
          ./nx run-many -t test -c azurestorage-bvt -p tag:provider:azurestorage &
          ./nx run-many -t test -c azurestorage-functional -p tag:provider:azurestorage &
          ./nx run-many -t test -c azurestorage-functional-1 -p tag:provider:azurestorage &
          ./nx run-many -t test -c azurestorage-functional-2 -p tag:provider:azurestorage &
          ./nx run-many -t test -c nats -p tag:provider:nats &
          # Class-level shards of the longest Provider=None suite
          ./nx run-many -t test -c functional-1 -p Orleans.Runtime.Internal.Tests &
          ./nx run-many -t test -c functional-2 -p Orleans.Runtime.Internal.Tests &
          status=0
          for job in $(jobs -p); do wait "$job" || status=1; done
          exit $status

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: ./nx fix-ci
        if: always()
